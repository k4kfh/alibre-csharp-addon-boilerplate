name: ci

# If this run can see the two secrets, it compiles the real add-on and tests the installer with it. That
# covers pushes to main and pull requests from branches in this repository, once they're set up.
# GitHub withholds them from forks and Dependabot, so they test the installer with a placeholder DLL.
# Nothing here runs inside Alibre.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  choose-track:
    name: Choose Track
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.check.outputs.full }}
    steps:
      - name: Check for the secrets
        id: check
        env:
          HAS_SECRETS: ${{ secrets.ALIBRE_SDK_DEPLOY_KEY != '' && secrets.ALIBRE_SDK_REPOSITORY != '' }}
        run: echo "full=$HAS_SECRETS" >> "$GITHUB_OUTPUT"

  compile:
    name: Compile Add-On
    needs: choose-track
    if: needs.choose-track.outputs.full == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/compile
        with:
          sdk-repository: ${{ secrets.ALIBRE_SDK_REPOSITORY }}
          deploy-key: ${{ secrets.ALIBRE_SDK_DEPLOY_KEY }}
          version: 0.0.0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stage
          path: artifacts/stage
          if-no-files-found: error
          retention-days: 1

  installer-test:
    name: Installer Test
    needs: [choose-track, compile]
    # Also runs when compile was skipped, as it is on the placeholder track, but not when compile failed.
    if: ${{ !cancelled() && needs.choose-track.result == 'success' && (needs.compile.result == 'success' || needs.compile.result == 'skipped') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Get the compiled add-on
        if: needs.compile.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stage
          path: artifacts/stage
      - name: Build the placeholder DLL
        if: needs.compile.result != 'success'
        shell: powershell
        run: ./scripts/build.ps1 -Version 0.0.0 -Placeholder
      - uses: ./.github/actions/package
        with:
          version: 0.0.0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-release-assets
          path: artifacts/release
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: installer-logs
          path: artifacts/logs
          if-no-files-found: ignore
