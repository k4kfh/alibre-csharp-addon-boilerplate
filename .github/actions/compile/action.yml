name: Compile the add-on
description: Fetches the Alibre files the add-on compiles against, builds it, verifies artifacts/stage, and removes those files.
inputs:
  sdk-repository:
    description: The private repository holding those files, as owner/name. Pass it from a secret.
    required: true
  deploy-key:
    description: SSH key with read access to that repository
    required: true
  version:
    description: x.y.z, with no leading v
    required: true
runs:
  using: composite
  steps:
    - name: Check for the secrets
      if: inputs.deploy-key == '' || inputs.sdk-repository == ''
      shell: powershell
      run: throw 'The ALIBRE_SDK_DEPLOY_KEY and ALIBRE_SDK_REPOSITORY secrets are not both available to this run. See BUILD-SYSTEM.md.'
    - name: Read which files to use
      id: sdk
      shell: powershell
      run: |
        $project = Import-PowerShellDataFile -LiteralPath project.psd1
        if (-not $project.SdkCommit -or -not $project.SdkFolder) {
          throw 'Set SdkCommit and SdkFolder in project.psd1. See BUILD-SYSTEM.md.'
        }
        "commit=$($project.SdkCommit)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii
        "folder=$($project.SdkFolder)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii
    - name: Fetch the Alibre files
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ inputs.sdk-repository }}
        ref: ${{ steps.sdk.outputs.commit }}
        ssh-key: ${{ inputs.deploy-key }}
        path: alibre-sdk
        persist-credentials: false
    - name: Check the Alibre files
      shell: powershell
      env:
        ALIBRE_SDK_DIR: ${{ github.workspace }}\alibre-sdk\${{ steps.sdk.outputs.folder }}
      run: ./scripts/resolve-sdk.ps1 -GitHubEnv $env:GITHUB_ENV
    - name: Build
      shell: powershell
      env:
        VERSION: ${{ inputs.version }}
      run: ./scripts/build.ps1 -Version $env:VERSION
    - name: Verify staged files
      shell: powershell
      env:
        VERSION: ${{ inputs.version }}
      run: ./scripts/verify-binary.ps1 -Version $env:VERSION
    - name: Remove the Alibre files
      if: always()
      shell: powershell
      run: Remove-Item -LiteralPath alibre-sdk -Recurse -Force -ErrorAction SilentlyContinue
